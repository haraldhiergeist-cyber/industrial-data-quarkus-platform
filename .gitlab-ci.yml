ui-build:
  stage: build
  image: node:22-alpine
  script:
    - cd plc-industrial-ui
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - plc-industrial-ui/dist/
    expire_in: 1 day
  rules:
    - changes:
        - .gitlab-ci.yml
        - plc-industrial-ui/**/*

ui-image:
  extends: .image-build
  needs:
    - job: ui-build
      artifacts: true
  variables:
    MODULE: plc-industrial-ui
    DOCKERFILE: Dockerfile.ci
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $IMAGE_PUSH_ENABLED == "true"'
      changes:
        - .gitlab-ci.yml
        - plc-industrial-ui/**/*

ui-update-infra:
