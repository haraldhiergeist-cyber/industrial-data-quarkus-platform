ui-build:
  stage: build
  image: node:22-alpine
  script:
    - cd plc-industrial-ui
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - plc-industrial-ui/dist/
    expire_in: 1 day
  rules:
    - changes: [.gitlab-ci.yml, plc-industrial-ui/**/*]

ui-image:
  extends: .service-image
  needs:
    - job: ui-build
      artifacts: true
  variables:
    MODULE: plc-industrial-ui
    IMAGE_NAME: harbor.cluster.lab/$HARBOR_PROJECT/plc-industrial-ui
    DOCKERFILE: Dockerfile.ci
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [.gitlab-ci.yml, plc-industrial-ui/**/*]

ui-update-infra:
  extends: .update-infra
  needs: [ui-image]
  variables:
    MODULE: plc-industrial-ui
    IMAGE_NAME: harbor.cluster.lab/$HARBOR_PROJECT/plc-industrial-ui
    INFRA_APP_PATH: web/plc-industrial-ui/overlays/dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [.gitlab-ci.yml, plc-industrial-ui/**/*]
