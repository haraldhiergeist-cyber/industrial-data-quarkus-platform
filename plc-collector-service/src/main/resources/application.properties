quarkus.application.name=plc-collector-service
quarkus.http.port=${HTTP_PORT:8080}

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.plc-readings-out.connector=smallrye-kafka
mp.messaging.outgoing.plc-readings-out.topic=${PLC_READINGS_TOPIC:plc.raw.readings}
mp.messaging.outgoing.plc-readings-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.plc-readings-out.health-readiness-enabled=true

plc.connection-string=${PLC_CONNECTION_STRING:s7://127.0.0.1?controller-type=S7_300}
plc.source=${PLC_SOURCE:plc-simulator-1}
plc.auto-reconnect=${PLC_AUTO_RECONNECT:true}
plc.poll-interval=${PLC_POLL_INTERVAL:1s}
plc.tags[0].name=temperature
plc.tags[0].address=%DB90.DBW0:INT
plc.tags[1].name=pressure
plc.tags[1].address=%DB90.DBW2:INT
plc.tags[2].name=level
plc.tags[2].address=%DB90.DBW4:INT

quarkus.micrometer.export.prometheus.enabled=true
