quarkus.application.name=plc-query-service
quarkus.http.port=${HTTP_PORT:8080}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://postgres.cluster.lab:5432/plcdb}
quarkus.datasource.username=${DB_USERNAME:plcuser}
quarkus.datasource.password=${DB_PASSWORD:plcpass}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}

quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.plc-readings-in.connector=smallrye-kafka
mp.messaging.incoming.plc-readings-in.topic=${PLC_READINGS_TOPIC:plc.raw.readings}
mp.messaging.incoming.plc-readings-in.group.id=${KAFKA_CONSUMER_GROUP:plc-query-quarkus-group}
mp.messaging.incoming.plc-readings-in.auto.offset.reset=earliest
mp.messaging.incoming.plc-readings-in.value.deserializer=com.plc.query.kafka.PlcReadingEventDeserializer
mp.messaging.incoming.plc-readings-in.enable.auto.commit=false
mp.messaging.incoming.plc-readings-in.failure-strategy=fail
mp.messaging.incoming.plc-readings-in.health-readiness-enabled=true

quarkus.oidc.auth-server-url=${KEYCLOAK_ISSUER_URI:https://keycloak.lab.harald-hiergeist.de/realms/industrial}
quarkus.oidc.application-type=service
quarkus.oidc.client-id=${OIDC_CLIENT_ID:plc-industrial-ui}

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:https://plc-ui-quarkus.lab.harald-hiergeist.de,http://localhost:4200}
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Origin

# Preserve the endpoint names used by the existing Angular generator.
quarkus.smallrye-openapi.path=/v3/api-docs
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true

quarkus.websockets-next.server.auto-ping-interval=30s
quarkus.websockets-next.server.metrics.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
